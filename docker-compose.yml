version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: udi-app
    environment:
      # 数据库配置（必填）
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # RSS配置（可选，有默认值）
      - RSS_DAILY_URL=${RSS_DAILY_URL:-https://udi.nmpa.gov.cn/rss/download.html?files=daily}
      # 文件目录配置
      - INBOX_DIR=/app/inbox
    volumes:
      - ./src:/app
      - ./inbox:/app/inbox
    restart: always
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python app.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
